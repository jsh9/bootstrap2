[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "bootstrap2"
version = "0.1.0"
dependencies = [
  "matplotlib>=3.5.0",
  "numpy>=1.21.3",
  "pandas>=1.3.4",
  "scipy>=1.7.3",
]
requires-python = ">=3.10"
authors = [
  {name = "jsh9", email = "25124332+jsh9@users.noreply.github.com"},
]
maintainers = [
  {name = "jsh9", email = "25124332+jsh9@users.noreply.github.com"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
description = "Implementations of the percentile based bootstrap"
keywords = ["ab-testing", "bootstrap", "confidence-intervals", "statistics"]
license = "BSD-3-Clause"
license-files = ["LICENSE", "PATENTS"]
readme = "README.md"

[project.urls]
Changelog = "https://github.com/jsh9/bootstrap2/blob/main/CHANGELOG.md"
Homepage = "https://github.com/jsh9/bootstrap2"
Issues = "https://github.com/jsh9/bootstrap2/issues"
Repository = "https://github.com/jsh9/bootstrap2.git"

[tool.format_docstring]
docstring_style = "numpy"
fix_rst_backticks = true
include_arg_defaults = true
include_arg_types = true
include_return_and_yield_types = true
line_length = 79

[tool.pydoclint]
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = false
check-return-types = false
exclude = '\.git|\.tox|\.venv|\.ipynb_checkpoints'
style = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
exclude = ["examples*", "tests*"]

[tool.yamlfix]
line_length = 79
none_representation = "null"
